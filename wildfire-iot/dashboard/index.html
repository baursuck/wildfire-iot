<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wildfire IoT Console</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<style>
  :root {
    --bg: #0a0b0d; --panel: #131519; --line: #23262d; --text: #eceef2; --muted: #8a909c;
    --ok: #34c759; --warn: #ffb020; --alarm: #ff453a; --accent: #0a84ff;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden;
         font: 14px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", sans-serif; }
  header { height: 56px; display: flex; align-items: center; gap: 16px; padding: 0 20px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
  header h1 span { color: var(--muted); font-weight: 400; }
  .pill { font-size: 12px; padding: 4px 10px; border-radius: 99px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); }
  .pill.ok { color: var(--ok); border-color: #1f4d2b; }
  #clock { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--muted); }
  main { display: grid; grid-template-columns: 300px 1fr 360px; height: calc(100vh - 56px); }
  aside { overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  aside.left { border-right: 1px solid var(--line); }
  aside.right { border-left: 1px solid var(--line); }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 4px 0 0; font-weight: 600; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; transition: border-color .4s, box-shadow .4s; }
  .card.alarm { border-color: var(--alarm); box-shadow: 0 0 0 1px var(--alarm), 0 0 32px rgba(255,69,58,.25); }
  .dev-head { display: flex; align-items: center; gap: 8px; font-weight: 600; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #555; flex: none; }
  .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .dot.alarm { background: var(--alarm); box-shadow: 0 0 10px var(--alarm); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  .sub { color: var(--muted); font-size: 12px; font-weight: 400; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; margin-top: 10px; font-size: 12px; }
  .grid b { display: block; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .grid span { color: var(--muted); }
  .wx { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .wx b { color: var(--text); font-weight: 500; }
  #map { height: 100%; background: #111; }
  .bw { font-size: 12px; color: var(--muted); }
  .bar { height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; margin: 6px 0 10px; }
  .bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .6s; }
  .bar.video i { background: #5a606b; }
  .ratio { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; }
  #alarm img { width: 100%; border-radius: 10px; display: block; margin-top: 10px; }
  #alarm .empty { color: var(--muted); font-size: 13px; }
  #fire { display: none; }
  #fire .coords { font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 6px; }
  #feed { font: 11px/1.5 ui-monospace, "SF Mono", Menlo, monospace; display: flex; flex-direction: column; gap: 2px; }
  #feed div { display: grid; grid-template-columns: 58px 1fr 56px; gap: 6px; color: var(--muted); animation: in .4s ease-out; }
  #feed div .t { color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #feed div .n { text-align: right; }
  #feed .detection .t { color: var(--alarm); font-weight: 700; }
  #feed .fire .t { color: var(--warn); font-weight: 700; }
  #feed .weather .t { color: #64d2ff; }
  #feed .status .t { color: var(--ok); }
  @keyframes in { from { opacity: 0; transform: translateY(-4px); } }
  .pulse { width: 22px; height: 22px; border-radius: 50%; background: var(--alarm); position: relative; }
  .pulse::after { content: ""; position: absolute; inset: -10px; border-radius: 50%; border: 3px solid var(--alarm); animation: ring 1.4s ease-out infinite; }
  @keyframes ring { from { transform: scale(.5); opacity: 1; } to { transform: scale(2.2); opacity: 0; } }
  .tower-icon { width: 14px; height: 14px; border-radius: 4px; background: var(--accent); border: 2px solid #fff; }
  .leaflet-container { font: inherit; }
  .sat { filter: brightness(.62) saturate(.8); }
  .leaflet-tooltip { background: var(--panel); color: var(--text); border: 1px solid var(--line); }
  .leaflet-tooltip-top:before { border-top-color: var(--line); }
</style>
</head>
<body>
<header>
  <h1>Wildfire <span>· IoT camera network</span></h1>
  <span id="conn" class="pill">broker: connecting…</span>
  <span id="msgs" class="pill">0 messages</span>
  <span id="clock"></span>
</header>
<main>
  <aside class="left">
    <h2>Edge nodes</h2>
    <div id="devices"></div>
    <h2>Uplink traffic</h2>
    <div class="card">
      <div class="bw">MQTT events <b id="bw-mqtt">0 KB</b></div>
      <div class="bar"><i id="bar-mqtt"></i></div>
      <div class="bw">Equivalent video stream <b id="bw-video">0 MB</b></div>
      <div class="bar video"><i id="bar-video" style="width:100%"></i></div>
      <div class="ratio" id="ratio">–</div>
      <div class="sub">less data over the mobile network</div>
    </div>
  </aside>
  <div id="map"></div>
  <aside class="right">
    <h2>Fire location</h2>
    <div id="fire" class="card alarm">
      <div class="dev-head"><span class="dot alarm"></span>Located by triangulation</div>
      <div class="coords" id="fire-coords"></div>
      <div class="sub" id="fire-info"></div>
    </div>
    <h2>Last alarm</h2>
    <div id="alarm" class="card"><div class="empty">No alarms yet. Edge nodes send only events, not video.</div></div>
    <h2>MQTT live</h2>
    <div id="feed"></div>
  </aside>
</main>
<script>
const BROKER = `ws://${location.hostname || "localhost"}:9001`;
const TOWERS = {
  "tower-01": { name: "Kaskelen ridge", lat: 43.1400, lon: 76.7000, heading_deg: 140.0, hfov_deg: 64 },
  "tower-02": { name: "Medeu", lat: 43.1570, lon: 77.0580, heading_deg: 245.1, hfov_deg: 64 },
  // third tower exists only on the interactive slide (no edge node behind it)
  "tower-03": { name: "Big Almaty", lat: 43.0550, lon: 77.0200, heading_deg: 300.0, hfov_deg: 64, virtual: true },
};
const state = {}; // tower id -> {status, hb, wx, alarm}
let msgCount = 0;

const map = L.map("map", { zoomControl: false, attributionControl: false }).setView([43.13, 76.88], 11);
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  { maxZoom: 18, className: "sat" }).addTo(map);

function dest(lat, lon, az, km) {
  const dLat = km * Math.cos(az * Math.PI / 180) / 110.57;
  const dLon = km * Math.sin(az * Math.PI / 180) / (111.32 * Math.cos(lat * Math.PI / 180));
  return [lat + dLat, lon + dLon];
}

const rays = {};
for (const [id, t] of Object.entries(TOWERS)) {
  state[id] = {};
  const fov = [[t.lat, t.lon]];
  for (let a = -t.hfov_deg / 2; a <= t.hfov_deg / 2; a += 4) fov.push(dest(t.lat, t.lon, t.heading_deg + a, 18));
  L.polygon(fov, { color: "#0a84ff", weight: 1, opacity: .5, fillOpacity: .07 }).addTo(map);
  L.marker([t.lat, t.lon], { icon: L.divIcon({ className: "", html: '<div class="tower-icon"></div>', iconSize: [14, 14] }) })
    .bindTooltip(`${id.toUpperCase()} · ${t.name}`, { permanent: true, direction: "top", offset: [0, -8] }).addTo(map);
}
let fireMarker = null;

function render() {
  const el = document.getElementById("devices");
  el.innerHTML = Object.entries(TOWERS).filter(([, t]) => !t.virtual).map(([id, t]) => {
    const s = state[id], hb = s.hb || {}, wx = s.wx;
    const online = s.status === "online";
    const dot = s.alarmUntil > Date.now() ? "alarm" : online ? "on" : "";
    return `<div class="card ${s.alarmUntil > Date.now() ? "alarm" : ""}" style="margin-bottom:12px">
      <div class="dev-head"><span class="dot ${dot}"></span>${id.toUpperCase()} <span class="sub">${t.name} · ${online ? "online" : s.status || "no data"}</span></div>
      <div class="grid">
        <div><b>${hb.fps ?? "–"}</b><span>inference FPS</span></div>
        <div><b>${hb.frames ?? "–"}</b><span>frames analysed</span></div>
        <div><b>${hb.uplink_bytes != null ? (hb.uplink_bytes / 1024).toFixed(1) + " KB" : "–"}</b><span>sent over MQTT</span></div>
        <div><b>${hb.alarms ?? "–"}</b><span>alarms</span></div>
      </div>
      ${wx ? `<div class="wx">🌡 <b>${wx.t}°C</b> 💧 <b>${wx.rh}%</b> 💨 <b>${wx.ws} m/s</b> ${wx.wd}° 🔋 <b>${wx.bat} V</b> 📶 <b>${wx.rssi} dBm</b></div>` : ""}
    </div>`;
  }).join("");

  let up = 0, vid = 0;
  for (const id in TOWERS) { up += state[id].hb?.uplink_bytes || 0; vid += state[id].hb?.video_equiv_bytes || 0; }
  document.getElementById("bw-mqtt").textContent = (up / 1024).toFixed(1) + " KB";
  document.getElementById("bw-video").textContent = (vid / 1048576).toFixed(1) + " MB";
  document.getElementById("bar-mqtt").style.width = vid ? Math.max(1, 100 * up / vid) + "%" : "0";
  document.getElementById("ratio").textContent = up ? `${Math.round(vid / up)}×` : "–";
}

function feed(topic, bytes, kind) {
  const el = document.getElementById("feed");
  const row = document.createElement("div");
  row.className = kind;
  row.innerHTML = `<span>${new Date().toLocaleTimeString("en-GB")}</span><span class="t">${topic}</span><span class="n">${bytes > 1024 ? (bytes / 1024).toFixed(1) + " KB" : bytes + " B"}</span>`;
  el.prepend(row);
  while (el.children.length > 60) el.lastChild.remove();
  document.getElementById("msgs").textContent = `${++msgCount} messages`;
}

function onDetection(d) {
  const t = TOWERS[d.tower_id];
  state[d.tower_id].alarmUntil = Date.now() + 15000;
  if (rays[d.tower_id]) map.removeLayer(rays[d.tower_id]);
  rays[d.tower_id] = L.polyline([[t.lat, t.lon], dest(t.lat, t.lon, d.azimuth_deg, 30)],
    { color: "#ff453a", weight: 2.5, dashArray: "8 6" }).addTo(map);
  document.getElementById("alarm").className = "card alarm";
  document.getElementById("alarm").innerHTML = `
    <div class="dev-head"><span class="dot alarm"></span>Smoke · ${d.tower_id.toUpperCase()} <span class="sub">${t.name}</span></div>
    <div class="grid">
      <div><b>${d.confidence.toFixed(2)}</b><span>confidence</span></div>
      <div><b>${d.azimuth_deg.toFixed(1)}°</b><span>bearing</span></div>
      <div><b>${d.frames_confirmed}</b><span>frames confirmed</span></div>
      <div><b>${d.ignition_offset_min != null ? "+" + d.ignition_offset_min + " min" : new Date(d.ts * 1000).toLocaleTimeString("en-GB")}</b><span>${d.ignition_offset_min != null ? "after ignition" : "time"}</span></div>
    </div>
    <img src="data:image/jpeg;base64,${d.snapshot_jpeg_b64}">`;
}

function onFire(f) {
  if (fireMarker) map.removeLayer(fireMarker);
  if (!f) { document.getElementById("fire").style.display = "none"; return; }
  fireMarker = L.marker([f.lat, f.lon], { icon: L.divIcon({ className: "", html: '<div class="pulse"></div>', iconSize: [22, 22] }) }).addTo(map);
  map.flyTo([f.lat, f.lon], 11.5, { duration: 1.5 });
  document.getElementById("fire").style.display = "block";
  document.getElementById("fire-coords").textContent = `${f.lat.toFixed(5)}, ${f.lon.toFixed(5)}`;
  document.getElementById("fire-info").textContent =
    `${f.distances_km[0]} km from ${f.towers[0].toUpperCase()} · ${f.distances_km[1]} km from ${f.towers[1].toUpperCase()} · rays cross at ${f.crossing_angle_deg}°`;
}

// A fire placed on the interactive slide: draw its bearing rays and the estimate.
function onSimFire(d) {
  for (const id in rays) map.removeLayer(rays[id]);
  for (const t of d.towers) {
    const id = t.id.toLowerCase(), tw = TOWERS[id];
    if (!tw) continue;
    rays[id] = L.polyline([[tw.lat, tw.lon], dest(tw.lat, tw.lon, t.bearing, t.km * 1.3)],
      { color: "#ff453a", weight: 2.5, dashArray: "8 6" }).addTo(map);
  }
  if (fireMarker) map.removeLayer(fireMarker);
  const card = document.getElementById("fire");
  if (!d.estimate) {
    card.style.display = "block";
    document.getElementById("fire-coords").textContent = "Direction only";
    document.getElementById("fire-info").textContent = `Simulation from slide · ${d.towers.length} tower sees it`;
    return;
  }
  const e = d.estimate;
  fireMarker = L.marker([e.lat, e.lon], { icon: L.divIcon({ className: "", html: '<div class="pulse"></div>', iconSize: [22, 22] }) }).addTo(map);
  map.flyTo([e.lat, e.lon], 11.5, { duration: 1.2 });
  card.style.display = "block";
  document.getElementById("fire-coords").textContent = `${e.lat.toFixed(5)}, ${e.lon.toFixed(5)}`;
  document.getElementById("fire-info").textContent =
    `Simulation from slide · ${d.towers.length} towers · error ${e.error_m} m · ${d.sensor === "ir" ? "thermal" : "optical"}, ${d.camera === "360" ? "360°" : "64°"} cameras`;
}

const client = mqtt.connect(BROKER, { reconnectPeriod: 2000 });
client.on("connect", () => {
  document.getElementById("conn").textContent = "broker: connected";
  document.getElementById("conn").className = "pill ok";
  client.subscribe("wildfire/#");
});
client.on("close", () => { document.getElementById("conn").textContent = "broker: offline"; document.getElementById("conn").className = "pill"; });
client.on("message", (topic, payload) => {
  const [, dev, kind] = topic.split("/");
  feed(topic, payload.length, kind);
  let d = null;
  try { d = payload.length ? JSON.parse(payload.toString()) : null; } catch { return; }
  if (dev === "server" && kind === "fire") return onFire(d);
  if (dev === "sim" && kind === "fire") return onSimFire(d);
  if (!state[dev] || !d) return;
  if (kind === "status") state[dev].status = d.state;
  if (kind === "heartbeat") state[dev].hb = d;
  if (kind === "weather") state[dev].wx = d;
  if (kind === "detection") onDetection(d);
  render();
});

setInterval(() => { document.getElementById("clock").textContent = new Date().toLocaleTimeString("en-GB"); render(); }, 1000);
render();
</script>
</body>
</html>
